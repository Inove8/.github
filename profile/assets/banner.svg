<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Inove8 — Technology and AI Delivery Partner. Build faster, launch sooner.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b0b"/>
      <stop offset="1" stop-color="#1a1410"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#ff8020"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff8020" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff8020" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <clipPath id="r"><rect width="1200" height="360" rx="22"/></clipPath>
    <style>
      .f{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
      .eyebrow{font-size:15px;font-weight:700;letter-spacing:4px;fill:#ff8020}
      .h{font-size:64px;font-weight:800;fill:#ffffff;letter-spacing:-1.5px}
      .sub{font-size:20px;fill:#bdbdbd}
      .chip{font-size:13px;font-weight:600;fill:#f2f2f2}
      .orb{animation:float 9s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      .orb2{animation:float 12s ease-in-out infinite reverse;transform-box:fill-box;transform-origin:center}
      .fade{opacity:0;animation:in .9s ease-out forwards}
      .d1{animation-delay:.15s}.d2{animation-delay:.45s}.d3{animation-delay:.75s}.d4{animation-delay:1.05s}
      .caret{animation:blink 1.1s step-end infinite}
      .ring{animation:spin 30s linear infinite;transform-box:fill-box;transform-origin:center}
      @keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(-24px,18px)}}
      @keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
      @keyframes blink{50%{opacity:0}}
      @keyframes spin{to{transform:rotate(360deg)}}
    </style>
  </defs>

  <g clip-path="url(#r)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
    <circle class="orb" cx="1010" cy="90" r="230" fill="url(#glow)"/>
    <circle class="orb2" cx="860" cy="330" r="170" fill="url(#glow)" opacity="0.6"/>

    <!-- orbit motif -->
    <g transform="translate(965 170)">
      <g class="ring">
        <circle r="118" fill="none" stroke="#ff8020" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="4 10"/>
        <circle cx="118" cy="0" r="6" fill="#ff8020"/>
      </g>
      <circle r="78" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>
      <text class="f" text-anchor="middle" y="22" font-size="64" font-weight="800" fill="url(#amber)">8</text>
    </g>

    <g class="f">
      <text x="64" y="80" class="eyebrow fade d1">TECHNOLOGY &amp; AI DELIVERY PARTNER</text>
      <text x="64" y="152" class="h fade d2">Build faster.</text>
      <text x="64" y="220" class="h fade d3">Launch <tspan fill="url(#amber)">sooner</tspan><tspan class="caret" fill="#ff8020">_</tspan></text>
      <text x="66" y="262" class="sub fade d4">Web &amp; mobile products, and the AI automation layer that makes them work.</text>
    </g>

    <g transform="translate(64 296)"><g class="f fade d4">
      <rect width="150" height="30" rx="15" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15"/>
      <text x="75" y="20" text-anchor="middle" class="chip">Product Engineering</text>
      <rect x="160" width="150" height="30" rx="15" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15"/>
      <text x="235" y="20" text-anchor="middle" class="chip">AI Voice Agents</text>
      <rect x="320" width="150" height="30" rx="15" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15"/>
      <text x="395" y="20" text-anchor="middle" class="chip">Data &amp; Custom SW</text>
      <rect x="480" width="150" height="30" rx="15" fill="#ff8020" fill-opacity="0.18" stroke="#ff8020" stroke-opacity="0.6"/>
      <text x="555" y="20" text-anchor="middle" class="chip">inove8.com →</text>
    </g></g>
  </g>
</svg>
