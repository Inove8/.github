name: 🐞 Bug report
description: Something isn't working as expected
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting! Please fill in as much as you can. **Security issues → see SECURITY.md instead.**
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Click on …
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: e.g. Chrome 129 on Windows 11 / Android 14 / Node 20
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs
      render: shell
